<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KRS Hiring Video Editor</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root {
    --navy: #012153;
    --navy-deep: #061A40;
    --orange: #FC7403;
    --bg: #F3F5F9;
    --card: #FFFFFF;
    --line: #D6DDE8;
    --slate: #34445F;
    --m: 72px; /* outer margin */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: linear-gradient(180deg, #F7F8FB 0%, #EEF1F6 100%);
    font-family: 'Montserrat', sans-serif;
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
  }
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .deco { position: absolute; inset: 0; }

  /* header */
  .logo { position: absolute; left: var(--m); top: 60px; height: 96px; width: auto; }

  /* headline */
  .kicker {
    position: absolute; left: var(--m); top: 196px;
    display: flex; align-items: center; gap: 20px;
    font-weight: 800; font-size: 36px; letter-spacing: 0.22em; line-height: 1;
    color: var(--navy);
  }
  .kicker .bar { width: 60px; height: 8px; background: var(--orange); }
  .role {
    position: absolute; left: 73px; top: 240px; margin: 0;
    font-weight: 900; font-size: 196px; line-height: 0.86; letter-spacing: -0.04em;
    color: var(--navy);
  }
  .role span { display: block; }
  .role .l2 { margin-left: -12px; }
  .role .dot { display: inline; color: var(--orange); }

  /* filter */
  .filter { position: absolute; left: var(--m); right: var(--m); top: 608px; }
  .tags { display: flex; gap: 20px; }
  .tag {
    flex: 1; display: flex; align-items: center; gap: 14px;
    height: 72px; padding: 0 20px 0 13px;
    background: var(--navy); color: #fff; border-radius: 12px;
    font-weight: 800; font-size: 30px; letter-spacing: 0.02em; white-space: nowrap; line-height: 1;
  }
  .tag .x { width: 46px; height: 46px; flex: none; }
  .tag .no { color: var(--orange); }
  .tag .t { position: relative; }
  .tag .t::after {
    content: ''; position: absolute; left: -5px; right: -5px; top: 50%;
    height: 4px; margin-top: -2px; background: var(--orange); border-radius: 2px;
  }
  .note {
    margin-top: 18px; display: flex; align-items: center; gap: 14px;
    font-weight: 600; font-size: 30px; line-height: 1; color: var(--slate);
  }
  .note svg { width: 36px; height: 36px; flex: none; }

  /* benefits */
  .benefits { position: absolute; left: var(--m); right: var(--m); top: 776px; }
  .sec {
    display: flex; align-items: flex-end; gap: 18px;
    font-weight: 800; font-size: 30px; letter-spacing: 0.24em; line-height: 1; color: var(--navy);
  }
  .sec .sq { width: 16px; height: 16px; margin-bottom: 7px; background: var(--orange); transform: skewX(-24deg); }
  .sec .rule { flex: 1; height: 26px; margin-bottom: 3px; display: block; overflow: visible; }
  .cards { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 26px;
    height: 98px; padding-right: 28px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 6px 18px rgba(1,33,83,0.06);
    overflow: hidden;
  }
  .num {
    flex: none; align-self: stretch; width: 92px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy); color: var(--orange);
    font-weight: 900; font-size: 38px; letter-spacing: -0.01em; line-height: 1;
  }
  .txt { flex: 1; min-width: 0; }
  .txt .h { font-weight: 800; font-size: 30px; line-height: 1.15; color: var(--navy); white-space: nowrap; letter-spacing: -0.005em; }
  .txt .s { margin-top: 3px; font-weight: 500; font-size: 28px; line-height: 1.2; color: var(--slate); white-space: nowrap; }
  .ic { flex: none; width: 52px; height: 52px; }

  /* CTA */
  .cta {
    position: absolute; left: var(--m); right: var(--m); top: 1184px; height: 102px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 0 36px;
    background: var(--orange); border-radius: 14px; color: var(--navy);
  }
  .cta .l { display: flex; align-items: baseline; gap: 22px; white-space: nowrap; }
  .cta .a { font-weight: 900; font-size: 42px; letter-spacing: 0.02em; }
  .cta .d { font-weight: 700; font-size: 30px; }
  .cta .go { width: 68px; height: 68px; flex: none; }
</style>
</head>
<body>
<div class="poster">

  <!-- brand slash (echo of the orange leg in the R) -->
  <svg class="deco" width="1080" height="1350" viewBox="0 0 1080 1350" aria-hidden="true">
    <polygon points="544,-2 674,-2 1008,396 878,396" fill="#FC7403"/>
  </svg>

  <img class="logo" src="../assets/logo-transparent.png" alt="KRS Tech Solutions">

  <div class="kicker"><span class="bar"></span>WE&rsquo;RE HIRING</div>
  <h1 class="role"><span class="l1">VIDEO</span><span class="l2">EDITOR<span class="dot">.</span></span></h1>

  <div class="filter">
    <div class="tags">
      <div class="tag">
        <svg class="x" viewBox="0 0 46 46"><circle cx="23" cy="23" r="23" fill="#FC7403"/><path d="M15.5 15.5 L30.5 30.5 M30.5 15.5 L15.5 30.5" stroke="#012153" stroke-width="5" stroke-linecap="round"/></svg>
        <span class="no">NO</span><span class="t">MOBILE EDITORS</span>
      </div>
      <div class="tag">
        <svg class="x" viewBox="0 0 46 46"><circle cx="23" cy="23" r="23" fill="#FC7403"/><path d="M15.5 15.5 L30.5 30.5 M30.5 15.5 L15.5 30.5" stroke="#012153" stroke-width="5" stroke-linecap="round"/></svg>
        <span class="no">NO</span><span class="t">CAPCUT EDITORS</span>
      </div>
    </div>
    <div class="note">
      <svg viewBox="0 0 36 36" fill="none" stroke="#012153" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="30" height="19" rx="2.5"/><path d="M12 31h12M18 24v7"/></svg>
      Professional desktop editors only
    </div>
  </div>

  <div class="benefits">
    <div class="sec"><span class="sq"></span>BENEFITS<svg class="rule" height="26" aria-hidden="true">
        <defs>
          <pattern id="ticks" width="60" height="26" patternUnits="userSpaceOnUse">
            <rect x="0" y="8" width="2" height="18" fill="#B9C3D3"/>
            <rect x="15" y="17" width="2" height="9" fill="#CDD5E1"/>
            <rect x="30" y="13" width="2" height="13" fill="#CDD5E1"/>
            <rect x="45" y="17" width="2" height="9" fill="#CDD5E1"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="100%" height="26" fill="url(#ticks)"/>
        <rect x="0" y="24" width="100%" height="2" fill="#B9C3D3"/>
        <svg x="68%" y="0" width="20" height="26" overflow="visible">
          <rect x="-1.5" y="6" width="3" height="20" fill="#FC7403"/>
          <polygon points="-8,0 8,0 8,6 0,12 -8,6" fill="#FC7403"/>
        </svg>
      </svg></div>
    <div class="cards">
      <div class="card">
        <div class="num">01</div>
        <div class="txt"><div class="h">PREMIUM SOFTWARE</div><div class="s">OEM license provided</div></div>
        <svg class="ic" viewBox="0 0 52 52" fill="none" stroke="#012153" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="8" width="38" height="30" rx="3"/><path d="M11 17h24M11 25h13"/><path d="M33.5 42.5L31 50l4.5-2.2L38 51M42.5 42.5L45 50l-4.5-2.2L38 51" stroke="#FC7403" stroke-width="2.6"/><circle cx="38" cy="35" r="8.5" fill="#FFFFFF" stroke="#FC7403"/>
        </svg>
      </div>
      <div class="card">
        <div class="num">02</div>
        <div class="txt"><div class="h">PREMIUM STOCK &amp; MOCKUP SUBSCRIPTION</div><div class="s">Pro subscription to a site like Envato</div></div>
        <svg class="ic" viewBox="0 0 52 52" fill="none" stroke="#012153" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="14" width="34" height="27" rx="3"/><path d="M12 8h33a3 3 0 0 1 3 3v23"/><path d="M17 21.5l10 6-10 6z" fill="#FC7403" stroke="#FC7403"/>
        </svg>
      </div>
      <div class="card">
        <div class="num">03</div>
        <div class="txt"><div class="h">AND MUCH MORE</div><div class="s">More perks &mdash; ask us in DM</div></div>
        <svg class="ic" viewBox="0 0 52 52" fill="none" stroke="#012153" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="21" width="38" height="26" rx="2"/><path d="M4 14h44v7H4zM26 14v33"/><path d="M26 14c-4-8-13-8-11-2 1 2 5 2 11 2zM26 14c4-8 13-8 11-2-1 2-5 2-11 2z" stroke="#FC7403"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="cta">
    <div class="l"><span class="a">APPLY NOW</span><span class="d">DM us your portfolio</span></div>
    <svg class="go" viewBox="0 0 68 68"><circle cx="34" cy="34" r="34" fill="#012153"/><path d="M22 34h24M36 24l10 10-10 10" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

</div>
</body>
</html>
