<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KRS Hiring Video Editor</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --navy:#012153; --navy-d:#061A40;
    --orange:#FC7403; --orange-2:#FF8A2A; --white:#FFFFFF; --muted:#B9C6DE; --steel:#8FA3C9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#04122E}
  body{margin:0;width:1080px;height:1350px;overflow:hidden;position:relative;
    font-family:Inter, sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(620px 520px at 26% 30%, rgba(28,82,180,.42), transparent 70%),
      radial-gradient(560px 480px at 88% 44%, rgba(252,116,3,.10), transparent 70%),
      radial-gradient(800px 600px at 12% 92%, rgba(10,42,102,.55), transparent 70%),
      linear-gradient(180deg,#0A2558 0%,#061A40 46%,#03102C 100%);}
  .fx{position:absolute;inset:0;pointer-events:none}
  .grain{opacity:.13;mix-blend-mode:overlay}
  .vignette{background:radial-gradient(ellipse 80% 72% at 50% 44%, transparent 58%, rgba(0,0,0,.45) 100%)}
  .abs{position:absolute}

  /* viewfinder frame — inside the 60..1020 safe column */
  .br{position:absolute;width:52px;height:52px;border:0 solid rgba(255,255,255,.78)}
  .br.c1{left:60px;top:56px;border-top-width:4px;border-left-width:4px}
  .br.c2{left:968px;top:56px;border-top-width:4px;border-right-width:4px}
  .br.c3{left:60px;top:534px;border-bottom-width:4px;border-left-width:4px}
  .br.c4{left:968px;top:534px;border-bottom-width:4px;border-right-width:4px}

  .kicker{left:96px;top:80px;height:50px;display:flex;align-items:center;gap:18px;
    font-family:'Barlow Condensed';font-weight:800;font-size:50px;line-height:1;letter-spacing:.16em;color:var(--orange)}
  .logo{left:684px;top:90px;width:300px;height:auto;display:block}

  .hl{left:92px;font-family:Anton;font-size:224px;line-height:1;white-space:nowrap}
  .hl.v{top:136px;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.35)}
  .hl.e{top:348px;margin-left:-5px;color:var(--orange);text-shadow:0 0 30px rgba(252,116,3,.26)}

  /* timeline */
  .tl{left:60px;top:616px;width:960px;height:144px;border:1px solid rgba(255,255,255,.14);border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));overflow:hidden}
  .tl > svg{position:absolute;left:0;top:0}
  .clip{position:absolute;top:36px;width:440px;height:68px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;gap:14px;border:2.5px solid var(--orange);
    background:repeating-linear-gradient(-45deg, rgba(255,255,255,.06) 0 9px, rgba(255,255,255,0) 9px 18px), #0A1A3E}
  .clip .x{flex:none;display:block}
  .clip .t{font-family:'Barlow Condensed';font-weight:800;font-size:42px;letter-spacing:.03em;line-height:1;white-space:nowrap}
  .clip .t b{color:var(--orange);font-weight:800}

  .only{display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-size:28px;font-weight:600;line-height:35px}
  .only svg{display:block}

  /* benefits */
  .bhead{left:60px;top:803px;width:960px;display:flex;align-items:center;gap:18px}
  .bhead h2{font-family:'Barlow Condensed';font-weight:800;font-size:44px;letter-spacing:.18em;line-height:1}
  .bhead .rule{flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,.06))}
  .b{left:60px;width:960px;height:76px;display:flex;align-items:center;gap:24px}
  .ic{width:76px;height:76px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(18,58,130,.8),rgba(10,42,102,.6));border:1.5px solid rgba(252,116,3,.75)}
  .bt{font-family:'Barlow Condensed';font-weight:800;font-size:40px;line-height:1;letter-spacing:.03em}
  .bs{margin-top:6px;font-size:28px;font-weight:500;color:var(--muted);line-height:1.15}
  .bn{margin-left:auto;font-family:Anton;font-size:50px;line-height:1;color:var(--steel);letter-spacing:.02em}
  .sep{left:160px;width:860px;height:1px;background:rgba(255,255,255,.10)}

  /* CTA */
  .cta{left:60px;top:1206px;width:960px;height:88px;border-radius:16px;overflow:hidden;
    background:#0A2150;border:1.5px solid rgba(252,116,3,.7)}
  .cta .btn{position:absolute;left:0;top:0;height:100%;width:430px;display:flex;align-items:center;gap:18px;padding-left:36px;
    color:#061A40;font-family:Anton;font-size:52px;letter-spacing:.03em;line-height:1}
  .cta .btn::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--orange-2),var(--orange));
    clip-path:polygon(0 0, calc(100% - 74px) 0, 100% 100%, 0 100%)}
  .cta .btn > *{position:relative}
  .cta .echo{position:absolute;left:372px;top:0}
  .cta .dm{position:absolute;left:470px;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center;gap:16px;
    font-size:32px;font-weight:600;line-height:1}
</style>
</head>
