<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>KRS Story Kinetic</title>
<link rel="stylesheet" href="../../assets/fonts.css">
<style>
@property --s1{syntax:'<number>';inherits:true;initial-value:1080}
@property --s2{syntax:'<number>';inherits:true;initial-value:1080}
@property --s3{syntax:'<number>';inherits:true;initial-value:1080}
:root{--navy:#012153;--navy-d:#061A40;--orange:#FC7403;--orange-2:#FF8A2A;--muted:#B9C6DE;--steel:#8FA3C9;
  --s1:1080;--s2:1080;--s3:1080}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#04122E}
body{margin:0;width:1080px;height:1920px;overflow:hidden;position:relative;background:#04122E;
  font-family:Inter,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.ct{position:absolute;left:0;top:0;width:1080px;height:1920px}
.bgA{background:
  radial-gradient(720px 640px at 28% 40%, rgba(28,82,180,.44), transparent 70%),
  radial-gradient(620px 560px at 92% 36%, rgba(252,116,3,.10), transparent 70%),
  radial-gradient(900px 760px at 10% 96%, rgba(10,42,102,.6), transparent 70%),
  linear-gradient(180deg,#0A2558 0%,#061A40 48%,#03102C 100%)}
.bgB{background:
  radial-gradient(760px 620px at 50% 46%, rgba(28,82,180,.40), transparent 70%),
  radial-gradient(640px 520px at 88% 82%, rgba(252,116,3,.10), transparent 70%),
  linear-gradient(180deg,#09224F 0%,#061A40 50%,#03102C 100%)}
.bgC{background:
  radial-gradient(760px 700px at 16% 58%, rgba(28,82,180,.40), transparent 70%),
  radial-gradient(560px 520px at 96% 30%, rgba(252,116,3,.09), transparent 70%),
  linear-gradient(180deg,#0A2558 0%,#061A40 52%,#03102C 100%)}
.bgD{background:
  radial-gradient(720px 640px at 28% 40%, rgba(28,82,180,.44), transparent 70%),
  radial-gradient(700px 420px at 50% 74%, rgba(252,116,3,.12), transparent 70%),
  radial-gradient(900px 760px at 10% 96%, rgba(10,42,102,.6), transparent 70%),
  linear-gradient(180deg,#0A2558 0%,#061A40 48%,#03102C 100%)}

/* seam bands (brand diagonal) */
.band{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.bando{background:linear-gradient(90deg,#FF8A2A,#FC7403)}
.bandg{background:#FC7403;opacity:.22}
.bandw{background:#fff;opacity:.85}

/* fx */
.fx{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.grain{opacity:.12;mix-blend-mode:overlay}
.vignette{background:radial-gradient(ellipse 84% 70% at 50% 46%, transparent 58%, rgba(0,0,0,.42) 100%)}

/* HUD */
.br{position:absolute;width:56px;height:56px;border:0 solid rgba(255,255,255,.8)}
.c1{left:60px;top:262px;border-top-width:5px;border-left-width:5px}
.c2{left:964px;top:262px;border-top-width:5px;border-right-width:5px}
.c3{left:60px;top:1524px;border-bottom-width:5px;border-left-width:5px}
.c4{left:964px;top:1524px;border-bottom-width:5px;border-right-width:5px}
.kicker{position:absolute;left:98px;top:308px;height:64px;display:flex;align-items:center;gap:20px}
.kslash{display:block;flex:none}
.ktxt{font-family:'Barlow Condensed';font-weight:800;font-size:54px;line-height:64px;letter-spacing:.16em;color:var(--orange);white-space:nowrap}
.logo{position:absolute;left:696px;top:296px;width:320px;height:147.2px}
.logo svg{position:absolute;left:0;top:0;width:320px;height:147.2px;overflow:visible;display:block}
.lleg{transform-origin:174px 64px}
.ltrail{filter:blur(1.5px)}

/* hero type */
.hl{position:absolute;font-family:Anton;font-size:350px;line-height:350px;white-space:nowrap}
.v{left:92px;top:541px;color:#fff;text-shadow:0 12px 44px rgba(0,0,0,.35);transform-origin:50% 55%}
.eo{position:absolute;left:87px;top:876px;width:980px;height:350px}
.ei{font-family:Anton;font-size:350px;line-height:350px;white-space:nowrap;color:var(--orange);
  text-shadow:0 0 36px rgba(252,116,3,.28);transform-origin:45% 55%}
.barw{position:absolute;left:87px;top:876px;width:10px;height:350px}
.bar{position:absolute;left:0;top:0;height:350px}
.b1{width:440px;clip-path:polygon(0 0,130px 0,440px 350px,310px 350px);background:linear-gradient(90deg,#FFA04D,#FC7403)}
.b2{width:760px;clip-path:polygon(130px 0,450px 0,760px 350px,440px 350px);background:linear-gradient(90deg,rgba(252,116,3,.55),rgba(252,116,3,0))}
.streaks{position:absolute;left:0;top:0;overflow:visible}

/* S1 strip */
.strip{position:absolute;left:64px;top:1330px;width:952px;height:150px;border:1px solid rgba(255,255,255,.14);border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));overflow:hidden}
.sclip{position:absolute;top:44px;height:52px;border-radius:8px;
  background:linear-gradient(180deg,#2A5DB8,#1A428E);border:1.5px solid rgba(255,255,255,.22)}
.ph{position:absolute;left:-14px;top:0;width:28px}
.ph svg{display:block}

/* S2 timeline */
.tl{position:absolute;left:64px;top:620px;width:952px;height:500px;border:1px solid rgba(255,255,255,.14);border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));overflow:hidden}
.tl .ph{z-index:1}
.clip{position:absolute;z-index:2;width:620px;height:140px;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;gap:18px;padding-left:36px}
.clip .base,.clip .dis,.clip .ring,.clip .ring0{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:14px}
.clip .base{background:linear-gradient(180deg,#2C60BC,#1B4490)}
.clip .dis{background:repeating-linear-gradient(-45deg, rgba(255,255,255,.075) 0 11px, rgba(255,255,255,0) 11px 22px), #0A1A3E}
.clip .ring0{border:2px solid rgba(255,255,255,.3)}
.clip .ring{border:3.5px solid var(--orange);box-shadow:inset 0 0 18px rgba(252,116,3,.25)}
.clip .x{position:relative;flex:none;display:block}
.clip .t{position:relative;font-family:'Barlow Condensed';font-weight:800;font-size:60px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.clip .t b{font-weight:800}
.pro{position:absolute;left:92px;top:1222px;display:flex;align-items:flex-start;gap:26px}
.pro .ck{display:block;flex:none;margin-top:4px}
.pro p{font-weight:700;font-size:64px;line-height:76px;letter-spacing:-.01em;white-space:nowrap}

/* S3 benefits */
.bh{position:absolute;left:64px;top:680px;width:952px;height:58px;display:flex;align-items:center;gap:24px}
.bh svg{display:block;flex:none}
.bh h2{font-family:'Barlow Condensed';font-weight:800;font-size:58px;letter-spacing:.18em;line-height:1}
.bh .rule{flex:1;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.06));transform-origin:0 50%}
.row{position:absolute;left:64px;width:952px;display:flex;align-items:center;gap:32px}
.tile{width:136px;height:136px;flex:none;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(18,58,130,.85),rgba(10,42,102,.65));border:2px solid rgba(252,116,3,.8)}
.tile svg{display:block}
.rtx{flex:1;min-width:0}
.rt{font-family:'Barlow Condensed';font-weight:800;font-size:60px;line-height:60px;letter-spacing:.03em;white-space:nowrap}
.rs{margin-top:12px;font-size:42px;font-weight:500;color:var(--muted);line-height:48px;white-space:nowrap}
.rn{flex:none;align-self:center;overflow:hidden;height:92px;font-family:Anton;font-size:88px;line-height:92px;color:var(--steel)}
.rn span{display:block}
.sep{position:absolute;left:232px;width:784px;height:2px;background:rgba(255,255,255,.12);transform-origin:0 50%}

/* S4 CTA */
.cta{position:absolute;left:64px;top:1302px;width:952px;height:140px;border-radius:18px;overflow:hidden;
  background:#0A2150;border:2px solid rgba(252,116,3,.75);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.cta .btn{position:absolute;left:0;top:0;height:100%;width:490px;display:flex;align-items:center;gap:18px;padding-left:40px;
  color:#061A40;font-family:Anton;font-size:64px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.cta .btn::before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(180deg,var(--orange-2),var(--orange));
  clip-path:polygon(0 0, calc(100% - 124px) 0, 100% 100%, 0 100%)}
.cta .btn > *{position:relative}
.cta .arr{display:block;flex:none}
.cta .echo{position:absolute;left:390px;top:-1px;display:block}
.cta .dm{position:absolute;left:512px;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:38px;font-weight:600;line-height:1;white-space:nowrap}
.cta .dm svg{display:block;flex:none}
